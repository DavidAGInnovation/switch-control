name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Build pinned host TLS dependency
        run: sh scripts/prepare_host_mbedtls.sh "$RUNNER_TEMP/mbedtls-host"
      - name: Run complete suite without skips
        env:
          ZA_MBEDTLS_HOST_ROOT: ${{ runner.temp }}/mbedtls-host
        run: python scripts/check.py
  switch-build:
    name: Switch build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Build pinned Switch TLS dependency
        run: sh usb-resident/prepare_mbedtls.sh "$RUNNER_TEMP/mbedtls-switch"
      - name: Build SD install package
        run: python assemble_release.py "$RUNNER_TEMP/release" --mbedtls-root "$RUNNER_TEMP/mbedtls-switch"
      - name: Bundle matching dependency source
        run: python scripts/dependency_source.py "$RUNNER_TEMP/mbedtls-switch" "$RUNNER_TEMP/release/switch-control-0.5.0-mbedtls-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          path: |
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/*-source.tar.gz
            ${{ runner.temp }}/release/release.json
          if-no-files-found: error
